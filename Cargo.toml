[package]
name = "starship"
version = "1.26.0"
authors = ["Starship Contributors", "echohumm <echo0humm@gmail.com>"]
build = "build.rs"
edition = "2024"
include = [
  "src/**/*",
  "/starship.exe.manifest",
  "media/icon.ico",
  "build.rs",
  "LICENSE",
  "/README.md",
  "docs/public/presets/toml/",
  ".github/config-schema.json",
]
license = "ISC"
repository = "https://github.com/echohumm/starship"
# Note: MSRV is only intended as a hint, and only the latest version is officially supported in starship.
rust-version = "1.99"

[features]
default = ["notify"]
config-schema = ["schemars"]
notify = ["notify-rust"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo", "unicode"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
dunce = "1.0.5"
# default feature restriction addresses https://github.com/starship/starship/issues/4251
gix = { version = "0.88.0", default-features = false, features = [
  "max-performance-safe",
  "revision",
  "status",
  "sha1",
  "sha256",
] }
guess_host_triple = "0.1.5"
home = "0.5.12"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.37", features = ["serde"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
log = { version = "0.4.34", features = ["std"] }
# notify-rust is optional (on by default) because the crate doesn't currently build for darwin with nix
# see: https://github.com/NixOS/nixpkgs/issues/160876
notify-rust = { version = "4.18.1", optional = true }
nu-ansi-term = "0.50.3"
# for efficient shared state between `git_status` and `git_metrics`, allowing parallel printing. This is for poison-free locks.
parking_lot = "0.12.5"
path-slash = "0.2.1"
pest = "2.9.2"
pest_derive = "2.9.2"
process_control = "5.2.0"
quick-xml = "0.42.0"
rand = "0.10.3"
rayon = "1.12.0"
regex = { version = "1.13.1", default-features = false, features = ["perf", "std", "unicode-perl"] }
rust-ini = "0.21.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }
shell-words = "1.1.1"
strsim = "0.11.1"
systemstat = "=0.2.7"
tempfile = "3.27.0"
terminal_size = "0.4.4"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
versions = "8.0.1"
which = "8.0.6"
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
yaml-rust2 = "0.13.0"
nix = { version = "0.31.3", default-features = false, features = ["feature", "fs", "user"] }

[dependencies.schemars]
version = "1.2.2"
optional = true
features = ["preserve_order", "indexmap2"]

[build-dependencies]
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }
dunce = "1.0.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

[profile.bench]
codegen-units = 16
lto = "thin"
strip = false

[lints.clippy]
use_self = "warn"
